[package]
name = "gcad"
version = "0.4.0"
edition = "2024"
description = "Parametric CAD written like G-code: one operation per line"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/gcad"

[workspace]
members = [".", "web", "sims-proto"]

[dependencies]
anyhow = "1.0.104"
rayon = "1.12"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.35"
egui_bench = { version = "0.4.1", features = ["viewer3d"] }
epaint_default_fonts = "0.35"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
monstertruck = { version = "0.4.1", features = ["solid", "step"] }
monstertruck-io = { version = "0.4.1", features = ["step"] }
monstertruck-modeling = { version = "0.4.1", features = ["font", "fillet"] }
monstertruck-topology = "0.4.1"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
bitcode = { version = "0.6", features = ["serde"] }
flate2 = "1"
sha2 = "0.10"
spade = "2.15"
robust = "1.2"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
ttf-parser = "0.25"
wgpu = "29"
sims-field = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-acoustics = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-frame = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-thermal = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-flow = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-magnetic = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-fem = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-tet = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
sims-progress = { git = "https://github.com/v0l/sims", rev = "e7160df323bbc8a8f0b99d706f338c9280feb9ae" }
pollster = "0.4"
bytemuck = "1"
toml = "1.1.8"
roxmltree = "0.21.1"
yaml-rust2 = "0.13.0"

[features]
gpu-tests = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["wayland", "x11"] }
faer = { version = "0.24", features = ["rayon"] }
notify = "8"
ureq = { version = "2.12", features = ["json"] }
gcad-sims-proto = { path = "sims-proto" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
web-time = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }

[patch.crates-io]
monstertruck = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-core = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-traits = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-derive = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-geometry = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-topology = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-mesh = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-meshing = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-modeling = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-solid = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-fillet = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-healing = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-assembly = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }
monstertruck-io = { git = "https://github.com/v0l/monstertruck", rev = "631ae0e8d2167e4e87a0bd96cc87f26eeaca2185" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
