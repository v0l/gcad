[package]
name = "gcad"
version = "0.2.0"
edition = "2024"
description = "Parametric CAD written like G-code: one operation per line"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/gcad"

[dependencies]
anyhow = "1.0.104"
rayon = "1.12"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_bench = { version = "0.2", features = ["viewer3d"] }
epaint_default_fonts = "0.35"
image = { version = "0.25.10", default-features = false, features = ["png"] }
monstertruck = { version = "0.4.1", features = ["solid", "step"] }
monstertruck-io = { version = "0.4.1", features = ["step"] }
monstertruck-modeling = { version = "0.4.1", features = ["font", "fillet"] }
monstertruck-topology = "0.4.1"
notify = "8"
serde_json = "1.0.151"
ttf-parser = "0.25"

[patch.crates-io]
monstertruck = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-core = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-traits = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-derive = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-geometry = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-topology = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-mesh = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-meshing = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-modeling = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-solid = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-fillet = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-healing = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-assembly = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
monstertruck-io = { git = "https://github.com/v0l/monstertruck", rev = "6f6e0766c74ab73c91c819d66eb74c6882a3b4d6" }
