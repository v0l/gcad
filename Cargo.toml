[package]
name = "gcad"
version.workspace = true
edition.workspace = true
description = "Parametric CAD written like G-code: one operation per line"
license.workspace = true
repository.workspace = true

[workspace]
members = [".", "web", "sims-proto", "crates/gcad-calc", "crates/gcad-parse", "crates/gcad-geom", "crates/gcad-host", "crates/gcad-plot", "crates/gcad-version", "crates/gcad-brep", "crates/gcad-render", "crates/gcad-drafting", "crates/gcad-sim", "crates/gcad-remote", "crates/gcad-view", "crates/gcad2glb", "crates/gcad-mesh", "crates/gcad-mesh-viewer", "crates/gcad-cloud"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/v0l/gcad"

[workspace.dependencies]
gcad-calc = { path = "crates/gcad-calc" }
gcad-parse = { path = "crates/gcad-parse" }
gcad-geom = { path = "crates/gcad-geom" }
gcad-host = { path = "crates/gcad-host" }
gcad-plot = { path = "crates/gcad-plot" }
gcad-brep = { path = "crates/gcad-brep" }
gcad-render = { path = "crates/gcad-render" }
gcad-drafting = { path = "crates/gcad-drafting" }
gcad-sim = { path = "crates/gcad-sim" }
gcad-remote = { path = "crates/gcad-remote" }
gcad-view = { path = "crates/gcad-view" }
gcad-sims-proto = { path = "sims-proto" }
gcad-version = { path = "crates/gcad-version" }
gcad-mesh = { path = "crates/gcad-mesh" }
gcad-cloud = { path = "crates/gcad-cloud" }
anyhow = "1.0.104"
bitcode = { version = "0.6", features = ["serde"] }
epaint_default_fonts = "0.35"
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lopdf = { version = "0.45", default-features = false }
monstertruck = { version = "0.4.1", features = ["solid", "step"] }
monstertruck-io = { version = "0.4.1", features = ["step"] }
monstertruck-modeling = { version = "0.4.1", features = ["font", "fillet"] }
monstertruck-topology = "0.4.1"
rayon = "1.12"
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sims-progress = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-field = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-acoustics = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-frame = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-thermal = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-flow = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-magnetic = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-fem = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
sims-tet = { git = "https://github.com/v0l/sims", rev = "99ab20b26822ac11125e2fefb41a83995ca75b62" }
spade = "2.15"
toml = "1.1.8"
ttf-parser = "0.25"
web-sys = "0.3"
web-time = "1"
yaml-rust2 = "0.13.0"
serde_json = "1.0.151"
ureq = { version = "2.12", features = ["json"] }

[dependencies]
gcad-calc.workspace = true
gcad-parse.workspace = true
gcad-geom.workspace = true
gcad-host.workspace = true
gcad-plot.workspace = true
gcad-brep.workspace = true
gcad-cloud.workspace = true
gcad-render.workspace = true
gcad-drafting.workspace = true
gcad-sim.workspace = true
gcad-sims-proto.workspace = true
gcad-view = { workspace = true, optional = true }
gcad-mesh = { workspace = true, features = ["parallel"] }
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
monstertruck.workspace = true
serde_json.workspace = true
lsp-server = "0.7"
crossbeam-channel = "0.5"

[features]
default = ["view", "game-assets"]
view = ["dep:gcad-view"]
gpu-tests = ["gcad-view?/gpu-tests"]
game-assets = ["view", "gcad-view/game-assets", "gcad-sim/game-assets"]

[[example]]
name = "game_asset_glb"
required-features = ["game-assets"]

[[example]]
name = "game_asset_normals_reference"
required-features = ["game-assets"]

[[example]]
name = "game_asset_renderer_fixture"
required-features = ["game-assets"]

[[example]]
name = "game_asset_preview_bench"
required-features = ["game-assets"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gcad-remote.workspace = true

[dev-dependencies]
gcad2glb = { path = "crates/gcad2glb" }
egui_bench = { version = "0.9.5", features = ["viewer3d"] }
image.workspace = true
robust = "1.2"
sha2.workspace = true

[patch.crates-io]
egui_bench = { git = "https://github.com/v0l/egui_bench", rev = "e37138d6c698c1fd6de2284acf23f669b27ab0a9" }
monstertruck = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-core = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-traits = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-derive = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-geometry = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-topology = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-mesh = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-meshing = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-modeling = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-solid = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-fillet = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-healing = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-assembly = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }
monstertruck-io = { git = "https://github.com/v0l/monstertruck", rev = "07cd072a872e45d75d42246933c282fc6430240d" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
