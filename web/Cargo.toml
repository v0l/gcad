[package]
name = "gcad-web"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
gcad = { path = ".." }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "History", "Response"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde_json = "1"
wasm-bindgen-rayon = { version = "1", features = ["no-bundler"] }
rayon = "1"
parking_lot_core = { version = "0.9", features = ["nightly"] }
