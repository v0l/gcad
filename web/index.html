<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gcad</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; height: 100%; background: #16181b; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; outline: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; color: #8a8f98; font: 14px sans-serif; }
</style>
</head>
<body>
<canvas id="gcad"></canvas>
<div id="loading">loading gcad</div>
<script type="module">
const loading = document.getElementById("loading");
if (!self.crossOriginIsolated) {
  loading.textContent = "gcad needs a cross-origin isolated page (COOP and COEP headers) to run its worker threads";
} else {
  const { default: init, initThreadPool, start } = await import("./gcad_web.js");
  await init();
  const asked = Number(new URLSearchParams(location.search).get("threads"));
  await initThreadPool(asked > 0 ? asked : navigator.hardwareConcurrency);
  start();
  loading.remove();
}
</script>
</body>
</html>
