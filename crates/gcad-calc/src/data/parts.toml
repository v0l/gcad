# Standard parts catalogue, mm. Each table lists the rows the parts command can resolve.
# nut4032 rows [major, across flats s, height m]; nut4035 [major, s, m]; nut7040 [major, s, h max]. ISO 4032, 4035 and 7040 from
#   https://raw.githubusercontent.com/shaise/FreeCAD_FastenersWB/master/FsData/iso4032def.csv (and iso4035def.csv, iso7040def.csv).
# washer7089 and washer7093 rows [major, inner d1, outer d2, thickness h]: FreeCAD_FastenersWB FsData/iso7089def.csv and iso7093def.csv.
# hex_head rows [major, head height k]: ISO 4017 and ISO 4014 nominal k, as in crates/gcad-brep/src/fastener.rs (M2 to M12 only).
# dowel_2338 and dowel_8734 are the nominal diameters of ISO 2338 and ISO 8734 (FreeCAD_FastenersWB FsData/iso2338def.csv, iso8734def.csv);
#   minimum lengths [d, min length] are the same files' Min_L column.
# key6885 rows [shaft over, shaft up to, b, h, t1, t2]: DIN 6885-1, https://mechcodex.com/reference/parallel-key-sizes
# circlip471 and circlip472 rows [shaft or bore d, thickness s, free diameter d3, radial width b, groove diameter]: DIN 471 and DIN 472,
#   FreeCAD_FastenersWB FsData/din471def.csv and din472def.csv. Sizes past 60 mm and the 28 mm bore row of DIN 472 (its groove
#   reads 20.4, an error in the source) are left out.
# belt rows [name, pitch, pitch line differential, belt thickness]: pitch line differential 0.254 for GT2 and 0.5715 for HTD 5M from
#   https://www.engbench.com/timingpulley.php, 0.381 for HTD 3M from https://github.com/gregsaun/maker_cheatsheet/blob/master/mechanical/timing_belt_pulley.md;
#   belt thickness 1.52, 2.41 and 3.81 mm from the Gates Light Power and Precision Drive Design Manual table 15,
#   https://www.gates.com/content/dam/documents-library/catalogs/light-power-and-precision-manual.pdf. Pulley outside diameter = teeth x pitch / pi - 2 x PLD.
# extrusion rows [name, side, centre bore]: the centre bore is the M5 (4.2) and M8 (6.8) tap drill of the slot, from data/thread_metric.toml.
#   Cross-section is the bounding square; no weight per metre is listed because no source was readable.
