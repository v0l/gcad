# Gland design values in inches, from the Parker O-Ring Handbook ORD 5700
# https://www.texasseal.com/pdfs/content/products/ORD_5700_parker_O-Ring_handbook_1.pdf
# static:  Design Chart 4-2 (Industrial O-Ring Static Seal Glands, 103.5 bar max)
# dynamic: Design Chart 5-2-a (Industrial Reciprocating O-Ring Packing Glands)
# face:    Design Chart 4-3 (O-Ring Face Seal Glands, liquids column)
# Pairs are [min, max]. depth is the gland depth L. width is G with no back-up ring,
# width1 with one back-up ring, width2 with two. clearance is the diametral clearance E.
# backup_width: back-up ring width max, Design Table 4-1 (AS5857) standard gland width chart
# Back-up ring threshold: handbook section 4.0, pressures above 103.5 bar (1500 psi).

[backup]
bar = 103.5
silicone_clearance_factor = 0.5

[[gland]]
kind = "static"
cs = 0.070
backup_width = 0.056
tol = 0.003
depth = [0.050, 0.052]
width = [0.093, 0.098]
width1 = [0.138, 0.143]
width2 = [0.205, 0.210]
clearance = [0.002, 0.005]

