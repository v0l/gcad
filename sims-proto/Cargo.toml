[package]
name = "gcad-sims-proto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Requests and replies of the gcad sims job server, shared by gcad, the server and its runners"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
