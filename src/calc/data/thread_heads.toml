# Socket screw heads, mm.
# iso4762 rows are [major, head diameter dk max, head height k, counterbore diameter, counterbore depth].
#   dk and k: https://www.roymech.co.uk/Useful_Tables/Screws/cap_screws.htm and
#   https://raw.githubusercontent.com/shaise/FreeCAD_FastenersWB/master/FsData/iso4762def.csv (agree on every row)
#   counterbore: FreeCAD PartDesign Resources/Hole/iso4762.json (ISO 4762 counterbore, diameter and depth)
#   https://raw.githubusercontent.com/FreeCAD/FreeCAD/main/src/Mod/PartDesign/Resources/Hole/iso4762.json
# iso7380 rows are [major, dk, k]: https://engineeringhardware.com/guide/standard/iso-7380-button-head-socket-screws/
#   and https://raw.githubusercontent.com/shaise/FreeCAD_FastenersWB/master/FsData/iso7380def.csv (agree; M14 and M20
#   are only in the first source and are left out). The standards give no counterbore, the tool uses dk + 1 and k + 0.4.
# iso10642 rows are [major, dk theoretical, k]: https://www.roymech.co.uk/Useful_Tables/Screws/cap_screws.htm and
#   https://raw.githubusercontent.com/shaise/FreeCAD_FastenersWB/master/FsData/iso10642def.csv (agree; M24 is only in
#   engineeringhardware.com and is left out). The countersink is 0.2 over dk.
